{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFlow - Iniciar Sesión</title>

    <!-- Favicon para la pestaña del navegador -->
    <link rel="icon" type="image/jpeg" href="{% static 'img/logo.jpg' %}">
    <link rel="shortcut icon" type="image/jpeg" href="{% static 'img/logo.jpg' %}">

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md">
        <!-- Cabecera de la tarjeta del formulario -->
        <div class="flex flex-col items-center justify-center mb-6">
            <img src="{% static 'img/logo.jpg' %}" alt="StockFlow Logo" class="h-28 w-auto object-contain mb-2 rounded-lg shadow-sm">
            <p class="text-xs text-slate-500 mt-1">Ingresa tus credenciales para acceder</p>
        </div>

        {% if form.errors %}
            <div class="bg-rose-100 border border-rose-300 text-rose-700 p-3 rounded-lg text-sm text-center mb-4">
                Usuario o contraseña incorrectos.
            </div>
        {% endif %}

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Usuario</label>
                <input type="text" name="username" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-slate-800 outline-none">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Contraseña</label>
                <input type="password" name="password" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-slate-800 outline-none">
            </div>
            <button type="submit" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 rounded-lg text-sm transition-colors">
                Ingresar al Sistema
            </button>
        </form>
    </div>

</body>
</html>
