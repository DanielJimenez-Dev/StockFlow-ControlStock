<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFlow - Eliminar Producto</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white p-6 rounded-lg shadow-md text-center">
        <div class="text-red-500 mb-4 text-4xl">⚠️</div>
        <h2 class="text-xl font-bold text-gray-800 mb-2">¿Eliminar producto?</h2>
        <p class="text-gray-600 mb-6">
            ¿Estás seguro de que deseas eliminar el producto
            <strong class="text-gray-900">"{{ product.name }}"</strong> (SKU: {{ product.sku }})? Esta acción no se
            puede deshacer.
        </p>

        <form method="post" class="flex justify-center gap-3">
            {% csrf_token %}
            <a href="{% url 'product_list' %}"
                class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300 font-medium">
                Cancelar
            </a>
            <button type="submit"
                class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 font-medium shadow-sm">
                Sí, eliminar
            </button>
        </form>
    </div>
</body>

</html>
